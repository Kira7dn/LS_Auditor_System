[project]
name = "ls-auditor-system"
version = "0.1.0"
description = "Operating System for LS Auditor Agents - Link Strategy Sovereign Edition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonpath-ng>=1.8.0",
    "mermaid-cli>=0.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "B", "I"]
