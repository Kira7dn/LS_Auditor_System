[project]
name = "ls-auditor-system"
version = "0.1.0"
description = "Operating System for LS Auditor Agents - Link Strategy Sovereign Edition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonpath-ng>=1.8.0",
    "mermaid-cli>=0.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "pypdf>=6.13.1",
    "python-docx>=1.2.0",
]

[project.scripts]
ls-auditor = "ls_auditor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.black]
line-length = 130
target-version = ["py312"]
